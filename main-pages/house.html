<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Code & Grow</title>
    <link rel="stylesheet" href="/Code-and-Grow/stylesheets/body.css" />
    <link rel="stylesheet" href="/Code-and-Grow/stylesheets/style.css" />
    <link rel="stylesheet" href="/Code-and-Grow/stylesheets/top-bar.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>

  <body class="room-img">
    <div class="top-bar">
      <div>
        <a href="/Code-and-Grow/main-pages/start-menu.html" class="bar-button" data-sound="icon">
          <i class="fa-solid fa-house"></i>
        </a>
        <a href="/Code-and-Grow/main-pages/island.html" class="bar-button" data-sound="icon">
          <i class="fa-solid fa-arrow-left"></i>
        </a>
      </div>

      <div class="resource-container">
        <div class="resource-item">
          <span class="resource-icon">⚡️</span>
          <span id="energyDisplay">10/10</span>
        </div>
        <div class="resource-item">
          <span class="resource-icon">❤️</span>
          <span id="healthDisplay">10/10</span>
        </div>
        <div class="resource-item">
          <span class="resource-icon">💰</span>
          <span id="moneyDisplay">0</span>
        </div>
      </div>

      <a href="/Code-and-Grow/side-pages/perfil.html" class="bar-button" data-sound="icon">
        <i class="fa-solid fa-user"></i>
      </a>
    </div>

    <div class="main-board">
      <img
        src="/Code-and-Grow/assets/bed.png"
        alt="Game Panda Bed"
        class="island-element bed"
        data-sound="click"
      />
      <div id="bedPopup" class="popup-message">
        Click me! Here you can rest.
      </div>

      <img
        src="/Code-and-Grow/assets/panda-young.png"
        alt="Game Panda"
        class="island-element panda"
        id="panda"
        data-sound="panda"
      />

      <img
        src="/Code-and-Grow/assets/wardrobe.png"
        alt="Game Panda Wardrobe"
        class="island-element wardrobe"
        data-sound="click"
      />
      <div id="wardrobePopup" class="popup-message">
        Click me! Here you can change clothes.
      </div>
    </div>

    <!-- Sleep Modal -->
    <div id="sleepModal" class="modal">
      <div class="modal-content">
        <p class="sleep-message">
          Your panda is sleeping... please wait 5 seconds 💤
        </p>
        <button id="wakeUpBtn" style="display: none">Wake Up</button>
      </div>
    </div>

    <!-- Wardrobe Modal -->
    <div id="wardrobeModal" class="modal">
      <div class="modal-content wardrobe-content">
        <div class="panda-preview">
          <img src="/Code-and-Grow/assets/panda.png" alt="Panda" class="panda-img" />
        </div>
        <div class="clothes-list">
          <h3>Available Clothes</h3>
          <div class="clothes-item" data-img="/Code-and-Grow/assets/hat.png">
            <img src="/Code-and-Grow/assets/hat.png" alt="Hat" />
            <span>Hat</span>
          </div>
          <div class="clothes-item" data-img="/Code-and-Grow/assets/shirt.png">
            <img src="/Code-and-Grow/assets/shirt.png" alt="Shirt" />
            <span>Shirt</span>
          </div>
          <div class="clothes-item" data-img="/Code-and-Grow/assets/pants.png">
            <img src="/Code-and-Grow/assets/pants.png" alt="Pants" />
            <span>Pants</span>
          </div>
        </div>
        <button id="closeWardrobeBtn">Close</button>
      </div>
    </div>
    <audio id="bgmAudio" src="/Code-and-Grow/assets/music/home.mp3" preload="auto"></audio>
    <audio id="iconSound" src="/Code-and-Grow/assets/music/click.mp3" preload="auto"></audio>
    <audio id="clickSound" src="/Code-and-Grow/assets/music/button.mp3" preload="auto"></audio>
    <audio id="pandaSound" src="/Code-and-Grow/assets/music/panda.mp3" preload="auto"></audio>
    <script src="/Code-and-Grow/scripts/sound-manager.js"></script>
    <script src="/Code-and-Grow/scripts/resource-manager.js"></script>
    <script src="/Code-and-Grow/scripts/sleeping-panda.js"></script>
    <script src="/Code-and-Grow/scripts/wardrobe-panda.js"></script>
    <script src="/Code-and-Grow/scripts/panda-animation.js"></script>
    <script src="/Code-and-Grow/scripts/elements-animation.js"></script>
  </body>
</html>
